# ============================================================
# Server
# ============================================================
server.port=${PORT:8080}

# ============================================================
# DataSource — overridden in production by SPRING_DATASOURCE_* env vars
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pet_grooming_salon?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari pool — small pool for Aiven free tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# SQL init (schema.sql / data.sql)
# ============================================================
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET:PetGroomingSalonSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN