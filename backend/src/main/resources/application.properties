# ===================================================================
# Spring Boot Configuration — Pet Grooming Salon Management System
# ===================================================================

spring.application.name=pet-grooming-salon
server.port=${SERVER_PORT:8080}

# -------------------------------------------------------------------
# MySQL — env vars injected by Docker Compose
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pet_grooming_salon?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA — validate only; schema.sql owns DDL
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Seed schema.sql + data.sql on startup (data.sql uses INSERT IGNORE)
# -------------------------------------------------------------------
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# -------------------------------------------------------------------
# JWT
# -------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:PetGroomingSalonSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.petgrooming.salon=INFO
logging.level.org.springframework.security=WARN