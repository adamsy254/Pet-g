# ============================================================
# Netlify build & routing configuration
# ============================================================

[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ============================================================
# API proxy — forwards /api/* to Render backend
# ============================================================
[[redirects]]
  from = "/api/*"
  to = "https://pet-g-1.onrender.com/api/:splat"
  status = 200
  force = true

# ============================================================
# SPA fallback
# ============================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================
# Security headers
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
